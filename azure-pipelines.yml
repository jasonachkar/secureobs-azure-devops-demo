trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: secureobs-demo

stages:
  - stage: SecureObsDemo
    displayName: Create project, scan, and ingest findings
    jobs:
      - job: SecurityScan
        displayName: Bootstrap SecureObs and run scanners
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'

          - script: |
              python -m pip install --upgrade pip
              pip install requests
            displayName: Install Python dependencies

          - script: |
              python scripts/bootstrap-demo.py \
                --secureobs-url "$SECUREOBS_BASE_URL" \
                --project-name "WebGoat Azure DevOps Demo" \
                --api-token "$SECUREOBS_API_TOKEN"
            displayName: Create or reuse SecureObs demo project
            env:
              SECUREOBS_BASE_URL: $(SECUREOBS_BASE_URL)
              SECUREOBS_API_TOKEN: $(SECUREOBS_API_TOKEN)

          - script: |
              mkdir -p scan-results

              docker run --rm -v "$(pwd)/scan-results:/output" aquasec/trivy:latest fs --format json --output /output/trivy.json .
              docker run --rm -v "$(pwd)/scan-results:/output" zricethezav/gitleaks:latest detect --source /output --report-format json --report-path /output/gitleaks.json || true
              docker run --rm -v "$(pwd)/scan-results:/output" returntocorp/semgrep:latest semgrep --config auto --json --output /output/semgrep.json . || true
            displayName: Run Trivy, Gitleaks, and Semgrep

          - script: |
              python scripts/ingest-findings.py \
                --input-dir scan-results \
                --secureobs-url "$SECUREOBS_INGEST_URL" \
                --project-id "$SECUREOBS_PROJECT_ID" \
                --api-token "$SECUREOBS_API_TOKEN"
            displayName: Ingest findings into SecureObs
            env:
              SECUREOBS_INGEST_URL: $(SECUREOBS_INGEST_URL)
              SECUREOBS_PROJECT_ID: $(SECUREOBS_PROJECT_ID)
              SECUREOBS_API_TOKEN: $(SECUREOBS_API_TOKEN)

          - publish: scan-results
            artifact: security-scan-results
